plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.20'
}

version = project.mod_version
group = 'dev.lumenfall'

base {
    archivesName = 'mist-iris'
}

repositories {
    maven { url = 'https://maven.caffeinemc.net/releases' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    compileOnly "net.caffeinemc:sodium-fabric:${project.sodium_version}"
    compileOnly fabricApi.module('fabric-block-getter-api-v2', project.fabric_api_version)
    compileOnly files(project.iris_jar)
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
